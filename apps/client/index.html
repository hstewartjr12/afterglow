<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="theme-color"
      content="#f3eee4"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12131c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Afterglow — find the visual novel that fits your mood."
    />
    <title>Afterglow — Visual Novel Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Oswald:wght@500;600;700&family=Shippori+Mincho:wght@500;600&display=swap"
    />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash.
      try {
        var theme = localStorage.getItem("afterglow-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
